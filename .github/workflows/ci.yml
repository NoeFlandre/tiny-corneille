name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: deterministic gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Install
        run: uv sync --locked --group docs
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check
      - name: Architecture
        run: uv run lint-imports
      - name: Tests and coverage
        run: uv run pytest --cov
      - name: CRAP
        run: |
          uv run coverage json -o coverage.json
          uv run python scripts/crap.py coverage.json --max 6
      - name: Docs
        run: uv run mkdocs build --strict

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Install
        run: uv sync --locked
      - name: Mutate
        run: uv run mutmut run
      - name: Fail on surviving or suspicious mutants
        run: |
          if uv run mutmut results | grep -E ': (survived|suspicious)'; then
            echo "surviving or suspicious mutants found"
            exit 1
          fi

  docker:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t tiny-corneille .
      - name: Smoke test
        run: |
          docker run --rm tiny-corneille --version
          docker run --rm tiny-corneille --help
